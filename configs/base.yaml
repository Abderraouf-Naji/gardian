seed: 42

paths:
  corpus_jsonl: "data/corpus.jsonl"
  bm25_index: "data/indices/bm25/unified"
  bm25_index_pkl: "data/indices/bm25/unified/index.pkl"
  faiss_index: "data/indices/faiss/unified/faiss.index"
  faiss_meta: "data/indices/faiss/unified/faiss_meta.jsonl"
  kg_graph: "data/kg/default/umls_kg.pkl"
  kg_lexical_idx: "data/kg/default/umls_kg_lex.pkl"
  rank_data_train: "data/rank_data_train.jsonl"
  rank_data_dev: "data/rank_data_dev.jsonl"
  results_dir: "results/"

# Corpus scale (mirrors scripts/00_download_data.py — regenerate data after changes).
corpus:
  total_passages: 3000000
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  pubmedqa_artificial_target_passages: 1500000
  medmcqa_target_passages: 450000

retrieval:
  top_k_bm25: 50
  top_k_faiss: 50
  top_k_spladepp: 50
  top_k_medcpt: 50
  # Larger pool improves positive-in-pool recall and gives KG branch room to matter.
  candidate_pool_size: 100
  # Real SPLADE (sparse-MLM, log(1+ReLU)+max-pool, vocabulary-space).
  # SPLADE++ (CoCondenser-EnsembleDistil) is the open learned-sparse retriever
  # used by GARDIAN.
  spladepp_encoder: "naver/splade-cocondenser-ensembledistil"
  spladepp_batch_size: 64
  spladepp_max_length: 256
  # MedCPT (NCBI biomedical dense; asymmetric Query/Article encoders).
  medcpt_article_encoder: "ncbi/MedCPT-Article-Encoder"
  medcpt_query_encoder: "ncbi/MedCPT-Query-Encoder"
  medcpt_batch_size: 256
  medcpt_max_length: 512

encoder:
  model_name: "NeuML/pubmedbert-base-embeddings"
  batch_size: 512
  max_length: 128

kg:
  max_path_length: 6
  max_entities_per_text: 16
  # Full-run mode keeps exact KG BFS disabled. Exact distances are useful for
  # small audits, but too slow for all-query rank generation on the full KG.
  exact_distance_features: false
  # Keep 0 for production speed; use exact KG only in targeted audits.
  refine_top_n: 0

model:
  sparse_feat_dim: 3
  dense_feat_dim: 4
  kg_feat_dim: 6
  # Slightly larger controller/heads for stronger branch balancing.
  branch_hidden: 2048
  controller_hidden: 2048
  query_feat_dim: 768
  # Must match src/common/question_types.ORDERED_QUESTION_TYPES (rank JSONL one-hot axes).
  question_types: ["diagnosis", "treatment", "mechanism", "contraindication", "factoid", "yesno", "other"]
  dropout: 0.15

training:
  epochs: 30
  batch_size: 256
  lr: 2.0e-5
  weight_decay: 1.0e-4
  margin: 1.0
  # Implemented in src/training/trainer.py as pairwise logistic BCE over
  # in-query positive/negative pairs.
  loss: "pairwise_bce"
  early_stopping_patience: 6
  eval_metric: "ndcg@10"
  num_negatives: 32
  # Bias pair sampling toward top-ranked non-gold candidates. These are the
  # negatives that most affect nDCG/MRR, so this improves training without
  # regenerating rank JSONL files.
  hard_negative_top_n: 100
  hard_negative_fraction: 0.75
  # Speed knobs for large rank JSONL training
  max_pairs_per_query: 32
  precompute_query_emb: true
  query_encoder_batch_size: 1024
  eval_batch_size: 8192
  query_emb_cache_path: "data/query_emb_cache_hybrid_train_all.pkl"
  # LRU cap for in-memory qid→query_emb entries during training (ignored if preloaded cache is larger).
  query_emb_cache_max_entries: 500000
  # Keep 0: StreamingRankDataset must preserve query-contiguous groups.
  # Line-level multi-worker sharding splits a query across workers and corrupts
  # positive/negative pair sampling.
  num_workers: 0
  cudnn_deterministic: true

evaluation:
  cutoffs: [5, 10, 20]
  question_type_breakdown: true

qa:
  # Causal biomedical LM (Mistral-derived). Falls back to Flan-T5 automatically if you
  # point reader_model at a seq2seq checkpoint.
  reader_model: meta-llama/Llama-3.1-8B-Instruct
  # Context window for tokenizer truncation (BioMistral / Mistral often 8k+).
  reader_max_input_length: 8192
  top_k_passages: 10
  # Decoder cap (BioMistral / other causal LMs: 512–2048 is usually enough; raise if outputs truncate).
  max_new_tokens: 2048
  # Self-RAG–inspired ReAct reader (Thought / Action / Observation + SELF_CRITIQUE).
  # Much slower (several decoder calls per question). Default off; enable for paper runs:
  #   qa.reader_react: true   or   python scripts/06_end_to_end_qa.py --reader-react ...
  reader_react: false
  reader_react_max_steps: 6
  reader_react_tokens_per_step: null  # null = heuristic from max_new_tokens / steps
